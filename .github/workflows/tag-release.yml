# Tag release for the platforms this repo ships: Windows (x64) installers and portable zips,
# plus Linux aarch64 (deb/rpm/tar.gz). macOS, Flatpak and Web are not built here; the shared
# multi-platform Release workflow (release.yml) stays reserved for the `release` branch.
# A pushed v* tag builds everything and publishes the release with the installers attached,
# so the releases page lists the downloads. The Kylin V10 SP1 debs come from
# kylin-v10-sp1-deb.yml, which attaches them to the same release.
name: Tag release (Windows + Linux aarch64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Clone craft-fonts (pinned, same ref as the Kylin workflow)
        shell: bash
        run: |
          set -e
          FONTS="$GITHUB_WORKSPACE/craft-fonts"
          git init -q "$FONTS"
          git -C "$FONTS" remote add origin https://github.com/storytold/craft-fonts.git
          for attempt in 1 2 3; do
            if git -C "$FONTS" fetch -q --depth 1 origin abb83316d96aa59c1cf64784289e378fe9fa5695; then
              break
            fi
            echo "craft-fonts fetch failed (attempt $attempt), retrying in 20s" >&2
            [ "$attempt" = "3" ] && exit 1
            sleep 20
          done
          git -C "$FONTS" checkout -q --detach FETCH_HEAD
          echo "CRAFT_FONTS_DIR=$FONTS" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      # Signing is optional: without WINDOWS_CERTIFICATE or the Azure Trusted Signing set,
      # sign.ps1 warns and ships unsigned.
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux-aarch64:
    name: Linux aarch64
    # Native arm runner (no QEMU). Ubuntu 22.04 keeps the glibc floor at 2.35, the same
    # baseline the regular distro packages have always had.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - name: Install nfpm (deb/rpm packager)
        run: |
          curl -sSfL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_arm64.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Clone craft-fonts (pinned)
        run: |
          set -e
          git init -q /tmp/craft-fonts
          git -C /tmp/craft-fonts remote add origin https://github.com/storytold/craft-fonts.git
          for attempt in 1 2 3; do
            if git -C /tmp/craft-fonts fetch -q --depth 1 origin abb83316d96aa59c1cf64784289e378fe9fa5695; then
              break
            fi
            echo "craft-fonts fetch failed (attempt $attempt), retrying in 20s" >&2
            [ "$attempt" = "3" ] && exit 1
            sleep 20
          done
          git -C /tmp/craft-fonts checkout -q --detach FETCH_HEAD
          echo "CRAFT_FONTS_DIR=/tmp/craft-fonts" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # AppImage is left out: it needs downloaded tooling, and the deb/rpm/tar.gz cover the
      # aarch64 distros this build targets.
      - name: Build and package
        env:
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh --formats "deb rpm tar"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-aarch64
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Draft the tag's GitHub release
    if: "!cancelled() && !contains(needs.*.result, 'failure')"
    needs: [windows, linux-aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # The Kylin workflow's publish-release job attaches its debs to this same release once it
      # exists. The release is published (not left a draft): a draft is visible to the
      # repository's admins only, so the releases page would show no download for anyone else.
      # It is created with its notes first and the assets follow as they upload, so the page is
      # never replaced wholesale (which would drop the Kylin debs attached in between).
      - name: Publish the tag's GitHub release with the installers
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          sha256sum -- * > SHA256SUMS.txt
          cat > release_notes.md <<EOF
          PhotoCraft ${TAG_NAME#v}

          Installers built from this tag. Pick the one for your system:

          | System | File |
          |---|---|
          | Windows x64 installer | \`photocraft-${TAG_NAME#v}-windows-x64.msi\` |
          | Windows x64, no install (unzip and run) | \`photocraft-${TAG_NAME#v}-windows-x64-portable.zip\` |
          | Linux aarch64 (Debian/Ubuntu) | \`photocraft-${TAG_NAME#v}-linux-aarch64.deb\` |
          | Linux aarch64 (Fedora/RHEL) | \`photocraft-${TAG_NAME#v}-linux-aarch64.rpm\` |
          | Linux aarch64, no install | \`photocraft-${TAG_NAME#v}-linux-aarch64.tar.gz\` |
          | Kylin V10 SP1, x64 / aarch64 | \`photocraft-${TAG_NAME#v}-kylin-v10-sp1-<arch>.deb\` (attached by the Kylin build once it finishes) |
          | Debug symbols for the Windows build | \`photocraft-${TAG_NAME#v}-windows-x64-symbols.zip\` (for crash reports; not needed to run) |

          \`SHA256SUMS.txt\` lists every attached file's checksum.

          On first start the app asks for an activation code: send it the machine code it
          shows, and enter the code you get back. The activation is stored in your home
          folder (\`~/.photocraft/.license.md\`); nothing else is written outside it.
          EOF
          # The installers and their checksums, never the notes file itself.
          assets=$(ls | grep -vx release_notes.md)
          # The release may already exist when this job runs: GitHub makes an empty one for a
          # tag that is moved, and the Kylin workflow attaches to it as soon as it finds it. So
          # the notes are written in both cases: this table first, then the Kylin section kept
          # when the Kylin workflow already added one (it replaces its own section on a re-run).
          set_notes() {
            gh release view "$TAG_NAME" --repo "$REPO" --json body --jq .body > current.md || : > current.md
            kylin="$(sed -n '/^## Kylin V10 SP1 packages/,$p' current.md)"
            if [ -n "$kylin" ]; then
              { cat release_notes.md; printf '\n'; printf '%s\n' "$kylin"; } > notes.md
            else
              cp release_notes.md notes.md
            fi
            gh release edit "$TAG_NAME" --repo "$REPO" --title "PhotoCraft ${TAG_NAME#v}" --notes-file notes.md
          }
          # The checksums list every file the release holds, whichever workflow attached it:
          # the Kylin workflow attaches its debs on its own schedule, and each workflow rebuilds
          # this file after its own upload, so the last one to run leaves a complete list.
          rebuild_sums() {
            rm -rf sums && mkdir sums
            gh release download "$TAG_NAME" --repo "$REPO" --dir sums \
              --pattern '*.msi' --pattern '*.zip' --pattern '*.deb' --pattern '*.rpm' --pattern '*.tar.gz'
            ( cd sums && sha256sum -- * > ../SHA256SUMS.txt )
            gh release upload "$TAG_NAME" --repo "$REPO" --clobber SHA256SUMS.txt
          }
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists; adding or replacing the Windows/Linux assets and the notes"
            # shellcheck disable=SC2086 # the file list is meant to split
            gh release upload "$TAG_NAME" --repo "$REPO" --clobber -- $assets
            set_notes
            rebuild_sums
          else
            echo "Publishing release $TAG_NAME"
            # shellcheck disable=SC2086 # the file list is meant to split
            gh release create "$TAG_NAME" --repo "$REPO" \
              --title "PhotoCraft ${TAG_NAME#v}" \
              --notes-file release_notes.md -- $assets
          fi
          echo "Release page: https://github.com/$REPO/releases/tag/$TAG_NAME"
          ls -lh
